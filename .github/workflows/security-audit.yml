name: Dependency security audit

on:
  push:
    branches: [master]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "**/gradle.lockfile"
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "**/gradle.lockfile"
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs for master and manual or
# scheduled dispatches are never cancelled.
concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  npm-audit:
    name: npm dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=high
      - run: npm audit --workspace @qc-remote/cloud --omit=dev --audit-level=moderate
      - run: npm audit --workspace @qc-remote/cloud --audit-level=high

  rustsec:
    name: RustSec (${{ matrix.directory }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - apps/windows/src-tauri
          - apps/ios/native-bridge/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.directory }}

  android-gradle-osv:
    name: Android Gradle lockfile advisories
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      # The reusable workflow's scanner/reporter fails the job on vulnerabilities.
      # SARIF upload needs a write token, which fork PRs do not receive.
      upload-sarif: false
      scan-args: |-
        --lockfile=apps/android/android/app/gradle.lockfile
