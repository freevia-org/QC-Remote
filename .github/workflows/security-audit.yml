name: Dependency security audit

on:
  workflow_dispatch:

permissions:
  contents: read

# Manual dispatches are never cancelled.
concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  npm-audit:
    name: npm dependencies
    runs-on: qc-remote-i5-linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=high
      - run: npm audit --workspace @qc-remote/cloud --omit=dev --audit-level=moderate
      - run: npm audit --workspace @qc-remote/cloud --audit-level=high

  rustsec:
    name: RustSec (${{ matrix.directory }})
    runs-on: qc-remote-i5-linux
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - apps/windows/src-tauri
          - apps/ios/native-bridge/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # audit-check runs `cargo install cargo-audit` (a ~3 minute release build
      # from source, in each of the three matrix jobs) unless cargo-audit is
      # already on PATH. Install the RustSec project's own prebuilt release
      # binary instead; install-action verifies its checksum. The audit itself,
      # its advisory database fetch, check runs and failure rules are unchanged.
      - name: Install prebuilt cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.directory }}

  android-gradle-osv:
    name: Android Gradle lockfile advisories
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # The reusable workflow's scanner/reporter fails the job on vulnerabilities.
      # SARIF upload needs a write token, which fork PRs do not receive.
      upload-sarif: false
      scan-args: |-
        --lockfile=apps/android/android/app/gradle.lockfile
