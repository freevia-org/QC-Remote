name: Website sync

on:
  push:
    branches: [master]
    paths:
      - README.md
      - docs/USER-GUIDE.md
      - scripts/check-website-sync.mjs
      - scripts/website-sync-contract.mjs
      - scripts/website-sync-contract.test.mjs
      - .github/workflows/website-sync.yml
  pull_request:
    paths:
      - README.md
      - docs/USER-GUIDE.md
      - scripts/check-website-sync.mjs
      - scripts/website-sync-contract.mjs
      - scripts/website-sync-contract.test.mjs
      - .github/workflows/website-sync.yml
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs for master and manual or
# scheduled dispatches are never cancelled.
concurrency:
  group: website-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test scripts/website-sync-contract.test.mjs
      - run: node scripts/check-website-sync.mjs
