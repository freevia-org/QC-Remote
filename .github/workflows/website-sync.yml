name: Website sync

on:
  workflow_dispatch:

permissions:
  contents: read

# Manual sync checks are isolated by ref and are not cancelled.
concurrency:
  group: website-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test scripts/website-sync-contract.test.mjs
      - run: node scripts/check-website-sync.mjs
