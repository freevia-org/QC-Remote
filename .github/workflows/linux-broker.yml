#I5 admission may wait up to 60 minutes. The original whole-work budget
#starts after the hook; each existing step receives only its remaining share.
#Step ids, commands, conditions and secret scopes stay in place.

name: Linux device broker

on:
  workflow_dispatch:
    inputs:
      build_linux_draft:
        description: Build the versioned Linux release draft from this exact commit
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Dispatch with `build_linux_draft` disabled to run the checks. Then dispatch
# again with it enabled to build a release draft from the same commit; the
# release job verifies that all checks, including the hosted AppArmor probe,
# already passed.
concurrency:
  group: linux-broker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-linux:
    name: Headless broker on native Linux
    if: ${{ !cancelled() && !inputs.build_linux_draft }}
    runs-on: qc-remote-i5-linux
    timeout-minutes: 80
    steps:
      - name: Start original execution budget after admission
        id: runner_work_budget
        if: ${{ contains(runner.name, '-i5-') }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_MINUTES: 20
        run: |+
          set -euo pipefail
          if [[ ! "$CI_EXECUTION_MINUTES" =~ ^[0-9]+$ ]] ||
             (( CI_EXECUTION_MINUTES < 1 || CI_EXECUTION_MINUTES > 360 )); then
            echo "::error::Invalid execution budget"
            exit 1
          fi
          printf 'deadline=%s\n' "$(( $(/usr/bin/date +%s) + CI_EXECUTION_MINUTES * 60 ))" >> "$GITHUB_OUTPUT"

      - name: Check remaining execution budget (1)
        id: runner_budget_001
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: &runner_budget_guard_native_linux |+
          set -euo pipefail
          if [[ ! "$CI_EXECUTION_DEADLINE" =~ ^[0-9]+$ ]] ||
             [[ ! "$CI_STEP_LIMIT" =~ ^[0-9]+$ ]] ||
             (( CI_STEP_LIMIT < 1 || CI_STEP_LIMIT > 360 )); then
            echo "::error::Execution budget metadata is unavailable"
            exit 1
          fi
          remaining=$(( CI_EXECUTION_DEADLINE - $(/usr/bin/date +%s) ))
          if (( remaining <= 0 )); then
            printf 'ready=false\nminutes=1\n' >> "$GITHUB_OUTPUT"
            echo "::error::Original execution budget exhausted after capacity admission"
            exit 1
          fi
          minutes=$(( (remaining + 59) / 60 ))
          if (( minutes > CI_STEP_LIMIT )); then minutes=$CI_STEP_LIMIT; fi
          printf 'ready=true\nminutes=%s\n' "$minutes" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_001.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_001.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (2)
        id: runner_budget_002
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_native_linux
      - name: Verify preinstalled isolated tray probe dependencies
        run: |
          for package in apparmor-utils bubblewrap dbus-daemon gir1.2-glib-2.0 python3-gi; do
            if ! dpkg-query -W -f='${Status}\n' "$package" 2>/dev/null | grep -Fxq 'install ok installed'; then
              echo "::error::Required runner package is missing: $package"
              exit 1
            fi
          done
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_002.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_002.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (3)
        id: runner_budget_003
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_native_linux
      # No rustfmt: formatting is platform independent, and ci.yml's `Rust
      # workspace` job checks it under the same change filter.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_003.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_003.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (4)
        id: runner_budget_004
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_native_linux
      # Master-only dispatches save this cache; validation on other refs reads it
      # without pushing branch-local copies into the shared cache budget.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-broker
          save-if: ${{ github.ref == 'refs/heads/master' }}
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_004.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_004.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (5)
        id: runner_budget_005
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_native_linux
      - name: Build the standalone Linux broker
        run: cargo build --locked -p qc-device-broker --bin qc-device-broker --features linux-tray
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_005.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_005.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (6)
        id: runner_budget_006
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_native_linux
      - name: Upload broker for the hosted AppArmor startup probe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qc-device-broker-linux-tray
          path: target/debug/qc-device-broker
          if-no-files-found: error
          retention-days: 1
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_006.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_006.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (7)
        id: runner_budget_007
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_native_linux
      # These real subprocess tests start disconnected; authentication/status,
      # election, filesystem modes, crash recovery and shutdown need no QC.
      # --probe, --verify-live and --auto-connect are deliberately absent.
      # Keep quadcortex selected here: qc-device-broker enables cloud-forward,
      # so this executes feature-gated unit tests not covered by ci.yml's
      # default-feature Quad Cortex job. Building it as a dependency is not enough.
      - name: Test shared engines and Linux native boundaries
        run: cargo test --locked -p quadcortex -p quadcortex-hid -p qc-broker-framing -p qc-owner-only-file -p qc-native-platform -p qc-device-broker --features qc-device-broker/linux-tray
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_007.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_007.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (8)
        id: runner_budget_008
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_native_linux
      - name: Lint Linux broker and adapters
        run: cargo clippy --locked -p quadcortex -p quadcortex-hid -p qc-broker-framing -p qc-owner-only-file -p qc-native-platform -p qc-device-broker --all-targets --features qc-device-broker/linux-tray -- -D warnings
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_008.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_008.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (9)
        id: runner_budget_009
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_native_linux
      - name: Check non-hardware executable entry point
        run: ./target/debug/qc-device-broker --self-check
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_009.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_009.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (10)
        id: runner_budget_010
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_native_linux
      - name: Test tray startup probe cleanup fixtures
        run: dbus-run-session -- python3 -m unittest scripts.test_linux_tray_startup -v
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_010.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_010.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (11)
        id: runner_budget_011
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_native_linux
      - name: Test Debian package verification and cleanup
        run: python3 -m unittest scripts.test_package_linux_deb
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_011.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_011.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (12)
        id: runner_budget_012
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_native_linux
      - name: Test Cargo test-executable selection
        run: python3 -m unittest scripts.test_select_cargo_test_executable
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_012.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_012.outputs.minutes || '1') || 360 }}

  linux-tray-startup-probe:
    name: Disconnected tray startup under AppArmor
    needs: native-linux
    if: ${{ !cancelled() && !inputs.build_linux_draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install isolated tray probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-utils bubblewrap dbus-daemon gir1.2-glib-2.0 python3-gi
      - name: Download broker built by the Linux runner
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qc-device-broker-linux-tray
          path: ${{ runner.temp }}/linux-tray-probe
      - name: Probe disconnected tray startup lifecycle
        run: |
          broker="${RUNNER_TEMP}/linux-tray-probe/qc-device-broker"
          chmod +x "$broker"
          report="${RUNNER_TEMP}/tray-startup-runtime-probe.json"
          python3 scripts/run-linux-tray-probe.py --broker "$broker" --report "$report" || {
            probe_status=$?
            if [[ -f "$report" ]]; then
              cat "$report"
            else
              echo "Tray startup probe failed before writing its report."
            fi
            exit "$probe_status"
          }

  linux-desktop-host:
    name: Linux Tauri host and resident tray
    if: ${{ !cancelled() && !inputs.build_linux_draft }}
    runs-on: qc-remote-i5-linux
    timeout-minutes: 105
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Start original execution budget after admission
        id: runner_work_budget
        if: ${{ contains(runner.name, '-i5-') }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_MINUTES: 45
        run: |+
          set -euo pipefail
          if [[ ! "$CI_EXECUTION_MINUTES" =~ ^[0-9]+$ ]] ||
             (( CI_EXECUTION_MINUTES < 1 || CI_EXECUTION_MINUTES > 360 )); then
            echo "::error::Invalid execution budget"
            exit 1
          fi
          printf 'deadline=%s\n' "$(( $(/usr/bin/date +%s) + CI_EXECUTION_MINUTES * 60 ))" >> "$GITHUB_OUTPUT"

      - name: Check remaining execution budget (1)
        id: runner_budget_001
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: &runner_budget_guard_linux_desktop_host |+
          set -euo pipefail
          if [[ ! "$CI_EXECUTION_DEADLINE" =~ ^[0-9]+$ ]] ||
             [[ ! "$CI_STEP_LIMIT" =~ ^[0-9]+$ ]] ||
             (( CI_STEP_LIMIT < 1 || CI_STEP_LIMIT > 360 )); then
            echo "::error::Execution budget metadata is unavailable"
            exit 1
          fi
          remaining=$(( CI_EXECUTION_DEADLINE - $(/usr/bin/date +%s) ))
          if (( remaining <= 0 )); then
            printf 'ready=false\nminutes=1\n' >> "$GITHUB_OUTPUT"
            echo "::error::Original execution budget exhausted after capacity admission"
            exit 1
          fi
          minutes=$(( (remaining + 59) / 60 ))
          if (( minutes > CI_STEP_LIMIT )); then minutes=$CI_STEP_LIMIT; fi
          printf 'ready=true\nminutes=%s\n' "$minutes" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_001.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_001.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (2)
        id: runner_budget_002
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_linux_desktop_host
      - name: Verify preinstalled Tauri, tray and Secret Service development libraries
        run: |
          for package in build-essential curl file libayatana-appindicator3-dev libdbus-1-dev \
              libgtk-3-dev libsecret-1-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev \
              libxdo-dev pkg-config; do
            if ! dpkg-query -W -f='${Status}\n' "$package" 2>/dev/null | grep -Fxq 'install ok installed'; then
              echo "::error::Required runner package is missing: $package"
              exit 1
            fi
          done
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_002.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_002.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (3)
        id: runner_budget_003
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_linux_desktop_host
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_003.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_003.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (4)
        id: runner_budget_004
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_linux_desktop_host
      - name: Install frontend dependencies and build the Linux UI
        run: |
          npm ci
          npm run build --workspace @qc-remote/windows
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_004.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_004.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (5)
        id: runner_budget_005
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_linux_desktop_host
      - name: Prepare Cargo-only Linux Tauri configuration
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path("apps/windows/src-tauri/tauri.linux.conf.json").read_text())
          config.setdefault("bundle", {})["externalBin"] = []
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("TAURI_CONFIG=" + json.dumps(config, separators=(",", ":")) + "\n")
          PY
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_005.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_005.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (6)
        id: runner_budget_006
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_linux_desktop_host
      # The app's checked-in rust-toolchain.toml intentionally pins Windows
      # MSVC. Explicit +stable selects this Linux runner's host toolchain.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_006.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_006.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (7)
        id: runner_budget_007
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_linux_desktop_host
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/windows/src-tauri -> target
          key: linux-tauri-host
          # Master only, as for the headless broker job above.
          save-if: ${{ github.ref == 'refs/heads/master' }}
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_007.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_007.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (8)
        id: runner_budget_008
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_linux_desktop_host
      # Cargo validates Rust host code only; packaging needs a verified,
      # target-suffixed external broker. Avoid a placeholder that could be
      # mistaken for a shippable sidecar. There is no separate fmt or check pass:
      # ci.yml's Windows app static checks format this workspace under the same
      # change filter, and the clippy step below type-checks every target with
      # these features.
      - name: Link the native Linux desktop executable, resident broker and MCP host
        working-directory: apps/windows/src-tauri
        run: cargo +stable build --locked --features tray-sidecar,custom-protocol --bin qc-remote --bin qc-device-broker
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_008.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_008.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (9)
        id: runner_budget_009
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_linux_desktop_host
      - name: Capture the exact GUI library test executable
        working-directory: apps/windows/src-tauri
        run: |
          set -o pipefail
          cargo +stable test --locked --features tray-sidecar,custom-protocol \
            --lib --no-run --message-format=json \
            | python3 ../../../scripts/select-cargo-test-executable.py
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_009.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_009.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (10)
        id: runner_budget_010
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_linux_desktop_host
      - name: Test the GUI host with its in-process broker
        working-directory: apps/windows/src-tauri
        env:
          QC_GATEWAY_EXECUTABLE: ${{ github.workspace }}/apps/windows/src-tauri/target/debug/qc-device-broker
        run: cargo +stable test --locked --features tray-sidecar,custom-protocol
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_010.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_010.outputs.minutes || '1') || 360 }}
      - name: Check remaining execution budget (11)
        id: runner_budget_011
        if: ${{ contains(runner.name, '-i5-') && (success()) }}
        timeout-minutes: 1
        shell: bash
        env:
          CI_EXECUTION_DEADLINE: ${{ steps.runner_work_budget.outputs.deadline }}
          CI_STEP_LIMIT: 360
        run: *runner_budget_guard_linux_desktop_host
      - name: Lint Linux GUI, tray and sidecar targets
        working-directory: apps/windows/src-tauri
        run: cargo +stable clippy --locked --all-targets --features tray-sidecar,custom-protocol -- -D warnings
        if: ${{ (success()) && (!contains(runner.name, '-i5-') || steps.runner_budget_011.outputs.ready == 'true') }}
        timeout-minutes: ${{ contains(runner.name, '-i5-') && fromJSON(steps.runner_budget_011.outputs.minutes || '1') || 360 }}

  linux-preview-release:
    name: Build Ubuntu preview release draft
    if: github.event_name == 'workflow_dispatch' && inputs.build_linux_draft
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      checks: read
    steps:
      # The check jobs are not repeated for a release build. This step is the
      # replacement: the exact commit being released must already carry a
      # successful result for each from a checks-only dispatch of this workflow
      # (GitHub Actions app only). Re-run the failed jobs of that run, or merge
      # first, if it does not; nothing is built until it does.
      - name: Require the checks-only result for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::The Linux release package is built from refs/heads/master only (got $GITHUB_REF)."
            exit 1
          fi
          required=(
            "Headless broker on native Linux"
            "Linux Tauri host and resident tray"
            "Disconnected tray startup under AppArmor"
          )
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100"             --jq '.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success") | .name')
          for name in "${required[@]}"; do
            if ! grep -Fxq "$name" <<<"$runs"; then
              echo "::error::No successful '$name' check run exists for $GITHUB_SHA. Dispatch this workflow with build_linux_draft disabled, then dispatch again to build the release."
              exit 1
            fi
            echo "ok: '$name' passed on $GITHUB_SHA"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # The release package build used to start from an empty target directory
      # (about 7 minutes in package-linux-deb.py). It writes the app's release
      # profile under apps/windows/src-tauri/target/<triple>/release.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/windows/src-tauri -> target
          key: linux-deb-release
      - name: Install Ubuntu 24.04 Tauri and HID build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl file libayatana-appindicator3-dev libdbus-1-dev \
            libgtk-3-dev libsecret-1-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev \
            libxdo-dev pkg-config python3
      - name: Read the release version from the source and verify every manifest agrees
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          expected = json.loads(Path("apps/windows/src-tauri/tauri.conf.json").read_text())["version"]
          assert re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", expected), expected
          versions = {
              "Tauri config": json.loads(Path("apps/windows/src-tauri/tauri.conf.json").read_text())["version"],
              "Cargo manifest": tomllib.loads(Path("apps/windows/src-tauri/Cargo.toml").read_text())["package"]["version"],
              "Cargo lock": next(p["version"] for p in tomllib.loads(Path("apps/windows/src-tauri/Cargo.lock").read_text())["package"] if p["name"] == "qc-remote"),
              "npm manifest": json.loads(Path("apps/windows/package.json").read_text())["version"],
              "npm lock": json.loads(Path("package-lock.json").read_text())["packages"]["apps/windows"]["version"],
          }
          assert all(version == expected for version in versions.values()), versions
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"LINUX_RELEASE_VERSION={expected}\n")
          PY
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build and verify Debian package from this source commit
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python3 scripts/package-linux-deb.py --timeout-seconds 3600
      - name: Name package and write checksum manifest
        run: |
          mapfile -t packages < <(find apps/windows/src-tauri/target -type f -path '*/bundle/deb/*.deb' -print)
          test "${#packages[@]}" -eq 1
          deb="qc-remote_${LINUX_RELEASE_VERSION}_amd64.deb"
          install -m 0644 "${packages[0]}" "$deb"
          sha256sum "$deb" > "qc-remote-v${LINUX_RELEASE_VERSION}-linux-SHA256SUMS.txt"
      - name: Attest the freshly built Debian package and checksum manifest
        id: attest-package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            qc-remote_${{ env.LINUX_RELEASE_VERSION }}_amd64.deb
            qc-remote-v${{ env.LINUX_RELEASE_VERSION }}-linux-SHA256SUMS.txt
      - name: Verify provenance and preserve the Sigstore bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-package.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="qc-remote-v${LINUX_RELEASE_VERSION}-linux-provenance.sigstore.json"
          install -m 0644 "$ATTESTATION_BUNDLE" "$bundle"
          for artifact in "qc-remote_${LINUX_RELEASE_VERSION}_amd64.deb" "qc-remote-v${LINUX_RELEASE_VERSION}-linux-SHA256SUMS.txt"; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/linux-broker.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Create the Linux-only GitHub draft prerelease and upload verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A separate v<version>-linux draft: the Windows/Android release for the
          # same version, its manifest and "Latest" are never touched.
          release_tag="v${LINUX_RELEASE_VERSION}-linux"
          gh release create "$release_tag" \
            "qc-remote_${LINUX_RELEASE_VERSION}_amd64.deb" \
            "qc-remote-v${LINUX_RELEASE_VERSION}-linux-SHA256SUMS.txt" \
            "qc-remote-v${LINUX_RELEASE_VERSION}-linux-provenance.sigstore.json" \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "QC Remote ${LINUX_RELEASE_VERSION} — Linux" \
            --notes "Ubuntu 24.04 x86_64 Linux package built from source commit $GITHUB_SHA. Fresh-login and physical QC acceptance are pending. This draft does not replace the stable Windows/Android release." \
            --repo "$GITHUB_REPOSITORY"
          release_id=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f make_latest=false
