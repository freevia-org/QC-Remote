name: iOS build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build unsigned iOS app and iPad DriverKit extension
    # The iOS device target is cross-compiled; use the online Apple Silicon MacMini runner.
    runs-on: qc-remote-macmini
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust and iOS target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-ios

      # The FFI test step compiled every dependency from source on each run.
      # This caches its target directory and ~/.cargo/registry (which the Xcode
      # build phase's own cargo build, targeting DerivedData, also reads).
      # Saved by the master push run, restored by pull requests.
      - name: Cache the iOS Rust bridge build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/ios/native-bridge/rust -> target
          key: ios-native-bridge
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install npm dependencies
        run: npm ci

      - name: Sync the Capacitor iOS project
        run: npm run ios:sync --workspace @qc-remote/ios

      - name: Test the iOS Rust bridge FFI on the runner
        run: cargo test --manifest-path apps/ios/native-bridge/rust/Cargo.toml --locked

      - name: Build app and DriverKit extension without signing
        run: >-
          xcodebuild
          -project apps/ios/ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/ios-derived-data"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qc-remote-ios-unsigned
          path: ${{ runner.temp }}/ios-derived-data/Build/Products/Debug-iphoneos/App.app
          if-no-files-found: error
