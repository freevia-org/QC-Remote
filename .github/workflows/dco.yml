name: DCO

# Run the DCO check only when a maintainer explicitly requests it. This job
# checks PR metadata from GitHub and fetches the PR head as Git data; it never
# checks out or executes pull-request code.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number targeting master
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dco-manual-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    if: github.ref == 'refs/heads/master'
    runs-on: qc-remote-i5-linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Check Signed-off-by on every commit the pull request adds
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QC_PR_NUMBER: ${{ inputs.pr_number }}
        run: node scripts/verify-dco-dispatch.mjs
