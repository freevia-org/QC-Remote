name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

# A new run for the same ref supersedes only an active pull request run. Manual
# dispatches are not cancelled, so an explicitly requested validation completes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a change needs: the native jobs (Rust, Windows app,
  # Android), the TypeScript job and the Cloud relay job. Only a change confined
  # to the matching skip set in scripts/ci-changes.mjs skips a job (legal
  # records, documentation and qc-ui source skip the native jobs and the relay;
  # markdown-only changes also skip TypeScript). A job skipped by `if:` reports
  # "Skipped", which branch protection accepts for a required check, so no
  # required check can stay pending; `changes` itself is not required and fails
  # open: if it errors or is skipped, every job runs. Pushes to master are
  # classified on what the push brought in (before..HEAD), so a legal-only merge
  # does not rebuild the native caches either.
  changes:
    name: Select jobs
    runs-on: qc-remote-i5-linux
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
      typescript: ${{ steps.filter.outputs.typescript }}
      cloud: ${{ steps.filter.outputs.cloud }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is the two-parent merge commit; a push needs the
          # commits it brought in, which a rebase merge can make many.
          fetch-depth: ${{ github.event_name == 'push' && 0 || 2 }}
      - id: filter
        env:
          QC_PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-changes.mjs

  rust:
    name: Rust workspace
    # The native jobs run on pull requests that touch more than the safe set
    # (see `changes`) and on every push to master. The master run is what keeps
    # the build caches warm: a pull request restores master's cache and does not
    # write its own (`save-if`), so a new pull request no longer starts from a
    # cold target directory. Nothing waits on the master run.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native != 'false') }}
    runs-on: qc-remote-i5-windows
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up MSVC build environment
        # Use default vswhere -latest discovery: this pinned action caps an
        # explicit 2022 selector at 17.9, excluding installed VS2022 17.14.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      # Cheapest checks first, so a formatting or lint mistake fails in seconds
      # instead of after the multi-minute test step. No separate `cargo build`:
      # `cargo test` builds and links every lib, bin and test target, and clippy
      # --all-targets has already checked the rest.
      - run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # packages/rust/quadcortex declares `rust-version = "1.87"`. Everything above
  # runs on stable, which would not notice a newer-than-1.87 language or std
  # feature creeping in; this job builds and tests the crate (lib, examples,
  # integration tests, doctests) on exactly the declared minimum. Keep the
  # toolchain below equal to that `rust-version`.
  rust-msrv:
    name: quadcortex on its declared Rust minimum (1.87)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native != 'false') }}
    runs-on: qc-remote-i5-windows
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up MSVC build environment
        # Default discovery includes VS2022 17.14 in its custom install path.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      # Same pinned action as the stable jobs; the `toolchain` input overrides
      # the branch's default of stable.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.87'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-1.87
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo +1.87 test -p quadcortex --locked
      # Optional encrypted forwarding uses a separate cipher dependency graph.
      # Default-feature tests do not verify that graph against the Rust minimum.
      - run: cargo +1.87 test -p quadcortex --features cloud-forward --locked

  # The Windows app used to be one 13 to 15 minute job. Its static checks and its
  # native tests share nothing at run time, so they are two jobs that run side by
  # side (the critical path is the tests job, about 9 minutes), and the job named
  # below is the unchanged required context that is green exactly when both are.
  rust-windows-app-static:
    name: Windows app static checks (fmt, check, clippy, broker build)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native != 'false') }}
    runs-on: qc-remote-i5-windows
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up MSVC build environment
        # Default discovery includes VS2022 17.14 in its custom install path.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # apps/windows/src-tauri/rust-toolchain.toml pins profile = "minimal",
          # which carries neither clippy nor rustfmt of its own.
          components: clippy, rustfmt
      # Formatting needs no build cache: run it first so it fails in seconds.
      - run: cargo fmt --check
        working-directory: apps/windows/src-tauri
      - name: Test Windows native runner command planning and failure cleanup
        run: node --test scripts/test-windows-native.test.mjs
      - name: Test Claude built-in Node and direct bridge startup
        run: node --test scripts/claude-mcp-startup.test.mjs
      - name: Test owned Gradle failure, interruption and launcher-termination cleanup
        run: node --test scripts/run-owned-gradle.test.mjs
      # Windows-only (it skips elsewhere); no other job ran it.
      - name: Test owned Windows producer admission, interruption and cleanup
        run: node --test scripts/windows-owned-producer.test.mjs
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/windows/src-tauri
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Stage check-only sidecar placeholders
        working-directory: apps/windows/src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType File -Force binaries/qc-device-broker-x86_64-pc-windows-msvc.exe | Out-Null
      # The app on its own, without the broker crate linked in.
      - run: cargo check --locked
        working-directory: apps/windows/src-tauri
      # The shipped qc-device-broker.exe (broker, tray icon and background MCP
      # host in one binary) is the `qc-device-broker` bin, which declares
      # `required-features = ["tray-sidecar"]`. Cargo silently skips a bin whose
      # required features are off, so every step below passes the feature;
      # without it CI would never compile the executable every install ships.
      - name: Build the shipped broker executable
        run: cargo build --locked --features tray-sidecar --bin qc-device-broker
        working-directory: apps/windows/src-tauri
      - run: cargo clippy --locked --all-targets --features tray-sidecar -- -D warnings
        working-directory: apps/windows/src-tauri

  rust-windows-app-tests:
    name: Windows app native tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native != 'false') }}
    runs-on: qc-remote-i5-windows
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up MSVC build environment
        # Default discovery includes VS2022 17.14 in its custom install path.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      # No clippy or rustfmt here: this job only builds and runs the tests.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Keeps the key (and so the cache already on master) of the job this
          # one was split out of.
          shared-key: rust-windows-app
          # scripts/test-windows-native.mjs first builds the broker from the ROOT
          # workspace (cargo build -p qc-device-broker, target/ at the repository
          # root), then the app's own tests. Caching only the app left that root
          # build compiling every dependency from source on each run (2m21s of
          # the 9m36s test step in the 0.1.189 pull request run).
          workspaces: |
            . -> target
            apps/windows/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Stage check-only sidecar placeholders
        working-directory: apps/windows/src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType File -Force binaries/qc-device-broker-x86_64-pc-windows-msvc.exe | Out-Null
      - name: Test the Windows shell with prebuilt broker and harness
        run: node scripts/test-windows-native.mjs --root .

  # The required context "Windows app (Rust backend)", kept under its old name
  # so branch protection needs no edit: green when the static checks and the
  # native tests both passed (or both were skipped by the change filter). It
  # runs for a few seconds after the slower of the two.
  rust-windows-app:
    name: Windows app (Rust backend)
    needs:
      - rust-windows-app-static
      - rust-windows-app-tests
    if: ${{ !cancelled() }}
    runs-on: qc-remote-i5-linux
    timeout-minutes: 5
    steps:
      - name: Fail unless both Windows app jobs passed or were skipped together
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | .key + ": " + .value.result'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  quadcortex-linux:
    name: Quad Cortex crate docs and Linux tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native != 'false') }}
    runs-on: qc-remote-i5-linux
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test -p quadcortex --locked
      - run: cargo doc -p quadcortex --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Always runs on a pull request, including legal-only ones: it is the check
  # that guards the legal records the native jobs only embed as bytes.
  third-party-notices:
    name: Third-party notices drift check
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: qc-remote-i5-linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only the root workspace: apps/windows/src-tauri pins a Windows-only
          # toolchain in rust-toolchain.toml, which rustup refuses on Linux.
          workspaces: .
          # This job runs on pull requests only, so a cache it saved could only
          # ever be read back by the same pull request, while every pull request
          # added another copy to the repository's 10 GB cache budget and pushed
          # master's build caches out. It reads `cargo metadata` (registry index
          # and crate sources), which the master-saved cache of the Linux
          # `quadcortex-linux` job already holds for the same root workspace,
          # toolchain and runner image: restore that one and never save.
          shared-key: quadcortex-linux
          save-if: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify dependency security workflow covers public lockfiles
        run: node --test scripts/security-audit-workflow.test.mjs
      - run: node --test scripts/verify-third-party-notices.test.mjs scripts/verify-license-carveout.test.mjs scripts/vite-qc-legal-assets.test.mjs
      - run: node scripts/verify-third-party-notices.mjs
      - run: node scripts/verify-license-carveout.mjs
      # Cargo, npm and Android toolchain manifests agreeing with each other and
      # with the pins this workflow installs; reads files only, no install.
      - name: Manifest and toolchain pin tests
        run: node --test scripts/verify-manifest-pins.test.mjs

  typescript:
    name: TypeScript packages and apps
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.typescript != 'false'))) }}
    runs-on: qc-remote-i5-linux
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The broker and the Windows app each compile their own copy of the broker
      # descriptor, generated from contracts/public/broker-tray-surface.v1.json.
      # A hand edit or a forgotten regeneration desynchronises the two crates
      # silently; the generator's --check mode catches it.
      - name: Generated broker tray surface drift check
        run: npm run contracts:check
      - run: npm run typecheck
      # The Windows, Android and iOS apps embed these bundles. The native jobs
      # build them too, but a pull request confined to the safe set in
      # scripts/ci-changes.mjs skips those, so this job is where a frontend
      # build break is caught on every pull request.
      - name: Web bundles the native apps embed (vite build)
        run: |
          npm run build:windows
          npm run build:android:web
          npm run build:ios:web
      - run: npm test

  public-history:
    name: Public history and path boundary
    runs-on: qc-remote-i5-linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Pushes to master are the published history: every reachable commit must
      # carry only public paths, privacy-preserving identities and no
      # Co-authored-by trailer, with one exemption. Commit
      # 2badc68ea4d30f53fc98ae9e000c70df109d0970 may carry that trailer: the
      # script pins that one full SHA and that one exact finding, and any other
      # finding on that commit, or the same finding on another commit, still
      # fails (publishedIdentityExceptions in scripts/verify-public-history.mjs).
      - name: Whole history (strict)
        if: github.event_name != 'pull_request'
        run: npm run audit:public-history
      # A pull request is judged on the commits it adds (base..head), not on every
      # ref the checkout carries. The path boundary always fails the run. The
      # identity rules fail it for a branch of this repository and are advisory
      # for a fork: CONTRIBUTING.md asks outside contributors for a real-name DCO
      # sign-off, and a maintainer publishes a privacy-preserving signed-off
      # commit instead of those identities as they stand. The published commit is
      # then held to the strict whole-history rules by the push run above. Values
      # arrive through env, never interpolated into the script.
      - name: Pull request range (path boundary; identity per origin)
        if: github.event_name == 'pull_request'
        env:
          QC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QC_IDENTITY: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'strict' || 'advisory' }}
        run: |
          node --test scripts/verify-public-history.test.mjs
          node scripts/verify-public-history.mjs --base "$QC_BASE_SHA" --head "$QC_HEAD_SHA" --identity "$QC_IDENTITY"
      # The DCO check is manually dispatched from master with a PR number.
      # These tests validate the checker and the safe metadata-only workflow;
      # this copy runs from the manually selected ref as an early signal.
      - name: DCO checker and workflow safety tests
        run: node --test scripts/verify-dco.test.mjs scripts/verify-workflows.test.mjs
      # The change classifier that decides which jobs run, and the workflow
      # wiring it relies on (path filters, gates, matrices, cache saving). It
      # needs no install, so this ~10 second job is where a broken filter or a
      # workflow edit that drifts from it fails first.
      - name: CI change filter and workflow wiring tests
        run: node --test scripts/ci-changes.test.mjs

  cloud-relay:
    name: Cloud relay (dry-run deploy)
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.cloud != 'false'))) }}
    runs-on: qc-remote-i5-linux
    timeout-minutes: 20
    # services/qc-remote-cloud is an npm workspace of the root package.json and
    # has no lockfile of its own: install from the root lock and run the
    # workspace's scripts with --workspace. (`npm ci` run from inside the
    # workspace directory prunes the root node_modules down to this workspace.)
    # The KV namespace id is a repository secret. A new repository, or a pull
    # request from a fork, has none: the secret expands to an empty string, and
    # `npm run check` (via kv:configure:dry-run) then binds the labelled
    # all-zero DRY-RUN PLACEHOLDER id in wrangler.check.jsonc and says so in the
    # log. That is enough for `wrangler types --check`, `tsc` and
    # `wrangler deploy --dry-run`. This job never deploys; the real
    # `npm run deploy` path refuses the placeholder, and the workspace's
    # `npm test` pins that. That test runs in the TypeScript job's root
    # `npm test`, which runs whenever this job does: a change that skips
    # TypeScript (markdown only) is always inside the set that skips this job.
    env:
      QCRC_OAUTH_KV_NAMESPACE_ID: ${{ secrets.QCRC_OAUTH_KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types, tsc and dry-run deploy (secret id when set, placeholder otherwise)
        run: npm run check --workspace @qc-remote/cloud

  android:
    name: Android app (debug build + unit tests)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native != 'false') }}
    runs-on: qc-remote-i5-linux
    timeout-minutes: 40
    # Deliberately debug-only: no release signing or keystore. Do not set QC_ANDROID_KEYSTORE_BASE64,
    # QC_ANDROID_KEYSTORE, QC_ANDROID_STORE_PASSWORD, QC_ANDROID_KEY_ALIAS,
    # or QC_ANDROID_KEY_PASSWORD as secrets
    # in this job: app/build.gradle only applies a signing config when all
    # four QC_ANDROID_* variables are present, so leaving them unset keeps
    # `assembleDebug` on Gradle's own throwaway debug signing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Android web assets and sync Capacitor
        run: npm run android:sync --workspace @qc-remote/android
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.gradle (dependencies and wrapper), keyed on the Gradle
          # files. Saved by the master run, restored by pull requests.
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install pinned Android SDK platform, build tools and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      # app/build.gradle's preBuild depends on buildSharedQcRust, which
      # cross-compiles packages/rust/quadcortex-android into the APK's jniLibs
      # through scripts/build-android-rust.ps1. That runs under pwsh off
      # Windows (preinstalled on GitHub's ubuntu runners) and needs Rust with
      # both Android targets, cargo-ndk, and an NDK. This is the real native
      # build, not a stub: the debug APK carries the same .so files as release.
      - name: Point the native build at the pinned NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Gradle debug build and unit tests
        working-directory: apps/android/android
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

  # One context that is green exactly when no CI job failed or was cancelled
  # (skipped jobs count as passing, which is what the path filters rely on).
  # It always runs, so it can never stay pending. Branch protection can require
  # just this check instead of ten job names, which also makes adding, renaming
  # or conditionally skipping a job a workflow-only change. `changes` is left
  # out on purpose: it fails open.
  ci-result:
    name: CI result
    if: ${{ always() }}
    needs:
      - rust
      - rust-msrv
      - rust-windows-app-static
      - rust-windows-app-tests
      - rust-windows-app
      - quadcortex-linux
      - third-party-notices
      - typescript
      - public-history
      - cloud-relay
      - android
    runs-on: qc-remote-i5-linux
    timeout-minutes: 5
    steps:
      - name: Fail if any CI job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | .key + ": " + .value.result'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
