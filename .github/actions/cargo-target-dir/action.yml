name: Keep Cargo build output on a self-hosted runner
description: >-
  Points CARGO_TARGET_DIR at a directory in the runner tool cache that survives
  between runs, and clears it when the Rust compiler changes. Does nothing on a
  GitHub-hosted runner, which starts empty and restores master's rust-cache
  instead. Run it after the toolchain is installed and before the first cargo
  command. Mirrors the Windows step in ci.yml.

inputs:
  name:
    description: Directory name for this job or lane; lanes that must not share artefacts use different names.
    required: true

runs:
  using: composite
  steps:
    - name: Keep Cargo build output on the runner
      if: ${{ runner.environment == 'self-hosted' }}
      shell: bash
      env:
        TARGET_NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail
        if [[ ! "$TARGET_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::Invalid Cargo target directory name: $TARGET_NAME"
          exit 1
        fi
        dir="$RUNNER_TOOL_CACHE/qc-remote-cargo-target/$TARGET_NAME"
        rustc_version="$(rustc -V)"
        if [[ -f "$dir.rustc" && "$(cat "$dir.rustc")" != "$rustc_version" ]]; then
          rm -rf "$dir"
        fi
        mkdir -p "$dir"
        printf '%s\n' "$rustc_version" > "$dir.rustc"
        {
          echo "CARGO_TARGET_DIR=$dir"
          echo "CARGO_INCREMENTAL=0"
        } >> "$GITHUB_ENV"
