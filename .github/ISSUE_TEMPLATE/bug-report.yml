# Field ids are a contract: apps/windows/src/about-content.ts (buildIssueUrl)
# prefills app-version, platform, behavior and diagnostics by id, and opens this
# form by its file name. Rename either here and the in-app "Report an Issue"
# window silently stops prefilling it.
name: Bug report
description: Report reproducible QC Remote behavior without sharing protected or sensitive material
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        QC Remote is independent and unofficial. Describe the behavior in text, with the minimum information needed to reproduce it. Security problems go through [SECURITY.md](https://github.com/freevia-org/QC-Remote/blob/HEAD/SECURITY.md), not this form.
  - type: checkboxes
    id: safe-material
    attributes:
      label: Safe report
      options:
        - label: I have not included credentials, tokens, serial numbers, personal data, device/manual screenshots, copyrighted media, proprietary presets, captures, or other material I am not authorized to share.
          required: true
  - type: input
    id: app-version
    attributes:
      label: QC Remote version
      description: Shown in About.
      placeholder: e.g. Windows 0.1.170 or Android 0.3.29
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. Windows 11 24H2 or Android 15
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Quad Cortex firmware (CorOS) version
      description: Optional, but device behavior depends on the firmware.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead, with minimal steps to reproduce. Redact identifying values.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Optional. Paste only QC Remote's redacted diagnostics (Copy diagnostics in the Windows app's Report an Issue window) after reviewing them yourself. Do not attach raw device dumps or logs containing sensitive values.
      render: text
