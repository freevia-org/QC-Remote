[package]
name = "qc-device-broker"
version = "0.1.0"
publish = false
edition = "2021"
description = "Native single-owner Quad Cortex USB broker"
license = "(MIT OR Apache-2.0) AND LicenseRef-QC-Remote-Reference"

[features]
default = []
# The app's published in-process MCP sidecar opts in; headless broker builds do not need D-Bus.
linux-tray = ["dep:ksni", "dep:zbus"]

[dependencies]
qc-broker-framing = { path = "../../packages/rust/qc-broker-framing" }
qc-owner-only-file = { path = "../../packages/rust/qc-owner-only-file" }
qc-native-platform = { path = "../../packages/rust/qc-native-platform" }
base64.workspace = true
prost.workspace = true
quadcortex = { path = "../../packages/rust/quadcortex" }
quadcortex-hid = { path = "../../packages/rust/quadcortex-hid" }
# The workspace `rand` (root Cargo.toml) stays on the same version as
# apps/windows/src-tauri/Cargo.toml's, so the shared-broker token/instance-id
# generation follows the same conceptual recipe as local_access.rs's loopback
# MCP descriptor minting. The shell is outside the workspace and cannot
# inherit it; scripts/verify-manifest-pins.test.mjs checks the two agree.
rand.workspace = true
# The update-only HTTP relay (src/updater_relay) is the broker's one outbound
# network use. Both crates are already in the lock file through
# qc-relay-client, so this adds no package. The relay's client turns off
# redirects, the system proxy and response decompression itself (explicit
# builder calls, not the absence of features), and tokio supplies only the
# current-thread runtime that drives it.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Constant-time bearer-token comparison, the same crate and version
# apps/windows/src-tauri's local_access.rs already uses.
subtle = "2"
tokio = { workspace = true, features = ["rt", "time"] }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
qc-windows-midi = { path = "../../packages/rust/qc-windows-midi" }
# Windows tray, interactive-session and installer-stop APIs.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
ksni = { version = "=0.3.6", optional = true, default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "=5.19.0", optional = true, default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
signal-hook = "0.3"
