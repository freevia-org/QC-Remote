[package]
name = "qc-device-broker"
version = "0.1.0"
publish = false
edition = "2021"
description = "Native single-owner Quad Cortex USB broker"
license = "(MIT OR Apache-2.0) AND LicenseRef-QC-Remote-Reference"

[features]
default = []
# The app's published in-process MCP sidecar opts in; headless broker builds do not need D-Bus.
linux-tray = ["dep:ksni", "dep:zbus"]

[dependencies]
quadcortex-forwarder = { path = "../../packages/rust/quadcortex-forwarder" }
bytes = "=1.12.1"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "=0.27.10", features = ["http1", "http2", "rustls-platform-verifier"] }
hyper-util = { version = "=0.1.20", features = ["client-legacy", "http1", "http2", "tokio"] }
qc-broker-framing = { path = "../../packages/rust/qc-broker-framing" }
qc-owner-only-file = { path = "../../packages/rust/qc-owner-only-file" }
qc-native-platform = { path = "../../packages/rust/qc-native-platform" }
base64.workspace = true
prost.workspace = true
quadcortex = { path = "../../packages/rust/quadcortex", features = ["cloud-forward"] }
quadcortex-hid = { path = "../../packages/rust/quadcortex-hid" }
# The workspace `rand` (root Cargo.toml) stays on the same version as
# apps/windows/src-tauri/Cargo.toml's, so the shared-broker token/instance-id
# generation follows the same conceptual recipe as local_access.rs's loopback
# MCP descriptor minting. The shell is outside the workspace and cannot
# inherit it; scripts/verify-manifest-pins.test.mjs checks the two agree.
rand.workspace = true
# URL parsing and method compatibility are shared with the broker's request
# validators. Hyper provides the direct HTTP transport; unlike a browser-style
# client it does not synthesize Accept or User-Agent headers.
reqwest.workspace = true
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Constant-time bearer-token comparison, the same crate and version
# apps/windows/src-tauri's local_access.rs already uses.
subtle = "2"
tower-service = "=0.3.3"
tokio = { workspace = true, features = ["rt", "time", "process", "io-util", "sync"] }
zeroize = "1"
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
qc-windows-midi = { path = "../../packages/rust/qc-windows-midi" }
# Windows tray, interactive-session and installer-stop APIs.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
ksni = { version = "=0.3.6", optional = true, default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "=5.19.0", optional = true, default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
signal-hook = "0.3"
