[package]
name = "qc-remote-mcp"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.88"
description = "Local MCP surface (loopback HTTP and stdio) for compatible Quad Cortex devices, embedded in the QC Remote desktop app"
license = "(MIT OR Apache-2.0) AND LicenseRef-QC-Remote-Reference"

[dependencies]
async-trait.workspace = true
axum = "0.8"
csv = "1"
qc-relay-protocol = { path = "../../packages/rust/qc-relay-protocol" }
rmcp = { version = "3.2", features = ["server", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
