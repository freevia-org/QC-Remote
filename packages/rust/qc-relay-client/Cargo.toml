[package]
name = "qc-relay-client"
version = "0.1.0"
publish = false
edition = "2021"
description = "Reusable outbound public-relay client for QC Remote device hosts"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait.workspace = true
futures-util = "0.3"
rand.workspace = true
reqwest = { workspace = true, features = ["json"] }
qc-relay-protocol = { path = "../qc-relay-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time", "test-util"] }
