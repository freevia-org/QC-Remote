[package]
name = "quadcortex-forwarder"
version = "0.1.0"
publish = false
edition = "2021"
description = "Request-owned transparent QC HTTP forwarding core"
license = "(MIT OR Apache-2.0) AND LicenseRef-QC-Remote-Reference"

[dependencies]
bytes = "=1.12.1"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "=0.27.10", features = ["http1", "http2", "rustls-platform-verifier"] }
hyper-util = { version = "=0.1.20", features = ["client-legacy", "http1", "http2", "tokio"] }
prost.workspace = true
quadcortex = { path = "../quadcortex", features = ["cloud-forward"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "net", "sync"] }
tower-service = "=0.3.3"
url = "2"
zeroize = "1"
