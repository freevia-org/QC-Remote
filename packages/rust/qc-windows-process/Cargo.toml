[package]
name = "qc-windows-process"
version = "0.1.0"
publish = false
edition = "2021"
description = "Shared Windows process-liveness checks for the Quad Cortex native hosts"
license = "MIT OR Apache-2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Rpc", "Win32_System_Variant", "Win32_System_Wmi"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Wdk_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_SystemInformation",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
rand.workspace = true
serde_json.workspace = true
