[package]
name = "quadcortex-android"
version = "0.1.0"
publish = false
edition = "2021"
description = "JNI binding for the shared QC native state engine"
license = "(MIT OR Apache-2.0) AND LicenseRef-QC-Remote-Reference"

[lib]
name = "quadcortex_android"
crate-type = ["cdylib"]

[dependencies]
jni = "0.22"
quadcortex = { path = "../quadcortex" }
serde_json.workspace = true

[dev-dependencies]
prost.workspace = true
