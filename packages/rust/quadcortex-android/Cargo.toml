[package]
name = "quadcortex-android"
version = "0.1.0"
publish = false
edition = "2021"
description = "JNI binding for the shared QC native state engine"
license = "(MIT OR Apache-2.0) AND LicenseRef-QC-Remote-Reference"

[lib]
name = "quadcortex_android"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
quadcortex = { path = "../quadcortex", features = ["cloud-forward"] }
serde_json.workspace = true
quadcortex-forwarder = { path = "../quadcortex-forwarder" }
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni-platform = { package = "jni", version = "0.22.4" }
rustls-platform-verifier = "0.7"

[dev-dependencies]
prost.workspace = true
