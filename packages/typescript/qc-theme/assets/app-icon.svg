<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">QC Remote</title>
  <desc id="desc">An original top-down floor-modeler symbol with a central routing screen, volume encoder, navigation controls, and eight footswitches.</desc>
