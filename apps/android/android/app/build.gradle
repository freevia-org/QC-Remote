apply plugin: 'com.android.application'

// The 0.2 JVM component moved from a Cargo-bundled Maven directory to the
// upstream archive. Pin the archive commit and keep the JVM version synchronized
// with Cargo; this repository serves only this exact module.
def rustlsVerifierPin = new groovy.json.JsonSlurper().parse(
    new File(rootProject.projectDir.parentFile.parentFile.parentFile,
        'contracts/public/android-tls-verifier.v1.json'))
if (rustlsVerifierPin.schemaVersion != 1
        || rustlsVerifierPin.cargoPackage != 'rustls-platform-verifier-android'
        || rustlsVerifierPin.repository != 'https://github.com/rustls/rustls-platform-verifier'
        || !(rustlsVerifierPin.archiveCommit ==~ /[0-9a-f]{40}/)
        || !(rustlsVerifierPin.aarSha256 ==~ /[0-9a-f]{64}/)
        || rustlsVerifierPin.group != 'org.rustls'
        || rustlsVerifierPin.artifact != 'rustls-platform-verifier') {
    throw new GradleException('Android TLS verifier archive pin is invalid.')
}
def rustlsVerifierMetadata = providers.exec {
    workingDir rootProject.projectDir.parentFile.parentFile.parentFile
    commandLine 'cargo', 'metadata', '--format-version', '1', '--locked',
        '--filter-platform', 'aarch64-linux-android', '--manifest-path',
        'packages/rust/quadcortex-android/Cargo.toml'
}.standardOutput.asText
def rustlsVerifierVersion = rustlsVerifierMetadata.map { text ->
    def metadata = new groovy.json.JsonSlurper().parseText(text)
    def matches = metadata.packages.findAll { it.name == rustlsVerifierPin.cargoPackage }
    if (matches.size() != 1 || matches[0].version != rustlsVerifierPin.version) {
        throw new GradleException('Android TLS verifier archive does not match the locked Cargo component.')
    }
    matches[0].version
}
repositories {
    exclusiveContent {
        forRepository {
            maven {
                url = uri("https://raw.githubusercontent.com/rustls/rustls-platform-verifier/${rustlsVerifierPin.archiveCommit}/android-release-support/maven/")
            }
        }
        filter { includeModule('org.rustls', 'rustls-platform-verifier') }
    }
}

// Check the exact AAR bytes before any Android compilation/packages consume it.
// The component filter avoids resolving artifacts from local Android projects.
def verifyRustlsVerifierArchive = tasks.register('verifyRustlsVerifierArchive') {
    doLast {
        def artifacts = configurations.getByName('releaseRuntimeClasspath').incoming.artifactView {
            componentFilter { id ->
                id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    && id.group == 'org.rustls' && id.module == 'rustls-platform-verifier'
            }
        }.files.files
        if (artifacts.size() != 1) throw new GradleException('Android TLS verifier AAR is missing or ambiguous.')
        def actual = java.security.MessageDigest.getInstance('SHA-256')
            .digest(artifacts.first().bytes).encodeHex().toString()
        if (actual != rustlsVerifierPin.aarSha256) throw new GradleException('Android TLS verifier AAR checksum mismatch.')
    }
}
tasks.named('preBuild').configure { dependsOn verifyRustlsVerifierArchive }

def qcSigningValues = [
    store: System.getenv('QC_ANDROID_KEYSTORE'),
    storePassword: System.getenv('QC_ANDROID_STORE_PASSWORD'),
    keyAlias: System.getenv('QC_ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('QC_ANDROID_KEY_PASSWORD')
]
def qcSigningConfigured = qcSigningValues.values().every { value -> value != null && !value.trim().isEmpty() }
if (qcSigningValues.values().any { value -> value != null && !value.trim().isEmpty() } && !qcSigningConfigured) {
    throw new GradleException('QC Android signing requires QC_ANDROID_KEYSTORE, QC_ANDROID_STORE_PASSWORD, QC_ANDROID_KEY_ALIAS, and QC_ANDROID_KEY_PASSWORD together.')
}

android {
    // Opt-in, platform-supplied legacy runner: no new Maven dependency.
    // Tests require a disposable Android runtime with these shared libraries.
    if (providers.gradleProperty('qcJniInstrumentation').orNull == 'true') {
        useLibrary 'android.test.base'
        useLibrary 'android.test.runner'
        defaultConfig {
            testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        }
    }
    namespace = "org.freevia.qcremote"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.freevia.qcremote"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 55
        versionName "1.0.1"
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        androidResources {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        qcDistribution {
            if (qcSigningConfigured) {
                storeFile file(qcSigningValues.store)
                storePassword qcSigningValues.storePassword
                keyAlias qcSigningValues.keyAlias
                keyPassword qcSigningValues.keyPassword
            }
        }
    }
    buildTypes {
        // Debug keeps Gradle's own throwaway debug keystore even when the
        // distribution key is present. A debuggable APK under the registered
        // identity installs over the real app and inherits its data, so
        // run-as and a debugger would reach a paired phone's relay state.
        // Only the release build type is ever signed as QC Remote.
        release {
            if (qcSigningConfigured) signingConfig signingConfigs.qcDistribution
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation "org.rustls:rustls-platform-verifier:${rustlsVerifierVersion.get()}"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def qcRepoRoot = rootProject.projectDir.parentFile.parentFile.parentFile
def buildSharedQcRust = tasks.register('buildSharedQcRust', Exec) {
    workingDir qcRepoRoot
    inputs.file(new File(qcRepoRoot, 'scripts/build-android-rust.ps1'))
    inputs.files(
        new File(qcRepoRoot, 'Cargo.toml'),
        new File(qcRepoRoot, 'Cargo.lock')
    )
    inputs.files(fileTree(new File(qcRepoRoot, 'packages/rust/quadcortex')) {
        include 'Cargo.toml', 'Cargo.lock', 'build.rs', 'proto/**', 'src/**'
        exclude 'target/**'
    })
    inputs.files(fileTree(new File(qcRepoRoot, 'packages/rust/quadcortex-android')) {
        include 'Cargo.toml', 'Cargo.lock', 'src/**'
        exclude 'target/**'
    })
    inputs.files(fileTree(new File(qcRepoRoot, 'packages/rust/quadcortex-forwarder')) {
        include 'Cargo.toml', 'src/**'
        exclude 'target/**'
    })
    outputs.files(
        new File(projectDir, 'src/main/jniLibs/arm64-v8a/libquadcortex_android.so'),
        new File(projectDir, 'src/main/jniLibs/x86_64/libquadcortex_android.so')
    )
    // Windows keeps using the inbox Windows PowerShell exactly as before. Elsewhere
    // (CI on ubuntu-latest, macOS/Linux developers) the same script runs under
    // PowerShell 7 (`pwsh`), which GitHub's hosted runners ship preinstalled;
    // ExecutionPolicy does not exist off Windows, so it is not passed there.
    def buildScript = new File(qcRepoRoot, 'scripts/build-android-rust.ps1').absolutePath
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
            buildScript, '-Profile', 'release'
    } else {
        commandLine 'pwsh', '-NoProfile', '-NonInteractive', '-File',
            buildScript, '-Profile', 'release'
    }
}
preBuild.dependsOn buildSharedQcRust
